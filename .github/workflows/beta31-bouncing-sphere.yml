name: Beta 3.1 bouncing sphere
on:
  push:
    branches: ["blueprint/test-bouncing-sphere"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-project:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Install desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libgl-dev
      - name: Build unchanged Beta 3.1 runtime and project test
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target nx_blueprint_tests --parallel 4
      - name: Run real Blueprint compiler and physics
        env:
          BP_BOUNCE_PROJECT: ${{ github.workspace }}/engine/tools/blueprint/examples/bouncing-sphere.bp.json
        run: ctest --test-dir build --output-on-failure --verbose --timeout 300 -R '^blueprint_runtime$'
